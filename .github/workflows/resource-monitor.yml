name: Resource Monitor & Cleanup
# Layer 2 of the resource monitor. Runs the shared engine
# (scripts/resource-monitor.sh) on the box and reports state. The same engine
# runs on-box every 2 hours via systemd timer (Layer 3); a flock serializes
# the two cadences.
#
# Layer 3 is the primary recovery path because it doesn't depend on any external
# service. This layer is the cloud-visible cadence and the backstop for when the
# on-box timer isn't installed — the same split load-guard and runner-health use.
#
# The checks used to live inline here as a long series of `ssh "..."` round-trips
# per run, which is both slow and the fail2ban risk the SSH sentinel below warns
# about. They now live in the engine, so there is ONE implementation for both
# layers instead of two that drift.
#
# The engine's volume pruning is anonymous-volumes-only, and deliberately so: a
# blanket `docker volume prune` would have destroyed podcastwiz_postgres-data on
# 2026-08-05. See is_anonymous_volume in the engine, and its tests.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: resource-monitor
  cancel-in-progress: false

jobs:
  resource-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          # Strip any CRLF from the secret (common cause of "error in libcrypto"
          # when the key was pasted from a Windows clipboard).
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          # Sentinel check — fail immediately if SSH doesn't work, rather than
          # letting the run continue and trigger fail2ban with retries.
          if ! ssh -o BatchMode=yes -o PreferredAuthentications=publickey -o IdentitiesOnly=yes -o ConnectTimeout=10 root@${{ secrets.SERVER_IP }} "true" 2>&1; then
            echo "❌ SSH auth failed — check SSH_PRIVATE_KEY / SERVER_IP and fail2ban"
            exit 1
          fi
          echo "✅ SSH connectivity verified"

      - name: Run the resource-monitor engine on the box
        id: check
        env:
          OBX_WEBHOOK_URL: ${{ secrets.OBX_WEBHOOK_URL }}
          OBX_TOKEN: ${{ secrets.OBX_TOKEN }}
        run: |
          SSH="ssh -o BatchMode=yes -o PreferredAuthentications=publickey -o IdentitiesOnly=yes -o ConnectTimeout=15 root@${{ secrets.SERVER_IP }}"
          # Pipe the repo's engine to the box and run it as root. Using the repo
          # copy (not the installed one) means this layer always runs the latest
          # engine and works even if Layer 3 isn't installed. The Ownersbox push
          # creds are prepended to the *script stream* as exports (carried over
          # the encrypted SSH channel, never in argv / `ps`) so the engine's
          # emit() can report this run to JARVIS.
          OUT=$( { printf 'export OBX_WEBHOOK_URL=%q OBX_TOKEN=%q\n' "${OBX_WEBHOOK_URL:-}" "${OBX_TOKEN:-}"; cat scripts/resource-monitor.sh; } | $SSH 'bash -s' 2>&1 || true)
          echo "$OUT"
          RESULT=$(printf '%s\n' "$OUT" | grep '^RESULT' | tail -1)
          LEVEL=$(printf '%s' "$RESULT" | sed -n 's/.*level=\([^ ]*\).*/\1/p')
          ACTION=$(printf '%s' "$RESULT" | sed -n 's/.*action=\([^ ]*\).*/\1/p')
          [ -z "$LEVEL" ] && LEVEL=unknown
          [ -z "$ACTION" ] && ACTION=unknown
          echo "level=$LEVEL"   >> "$GITHUB_OUTPUT"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          {
            echo "## Resource Monitor"
            echo ""
            echo "- level: \`$LEVEL\`"
            echo "- action: \`$ACTION\`"
            echo "- raw: \`$RESULT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run if something is broken and nothing could fix it
        run: |
          # `critical` from this engine means a problem was detected and NOT
          # remediated. A green run on that would be the workflow lying.
          LEVEL="${{ steps.check.outputs.level }}"
          case "$LEVEL" in
            critical*) echo "::error::resource-monitor reported critical: nothing remediated"; exit 1 ;;
            unknown)   echo "::error::no RESULT line — the engine did not complete"; exit 1 ;;
            *)         echo "level=$LEVEL"; ;;
          esac
