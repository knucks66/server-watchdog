name: Server Health Check & Auto-Reboot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check server health
        id: health
        run: |
          # Read endpoints from config file
          ENDPOINTS=$(grep '^\s*url:' endpoints.yml | sed 's/.*url:\s*//' | tr -d '"' | tr -d "'")

          FAILURES=0
          TOTAL=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            TOTAL=$((TOTAL + 1))
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 30 "$url" 2>/dev/null || echo "000")
            echo "  $url → HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "000" ]; then
              FAILURES=$((FAILURES + 1))
            fi
          done <<< "$ENDPOINTS"

          echo "failures=$FAILURES" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

          if [ "$FAILURES" -eq "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
            echo "status=down" >> "$GITHUB_OUTPUT"
            echo "⚠️ All endpoints unreachable — server appears down"
          else
            echo "status=up" >> "$GITHUB_OUTPUT"
            echo "✅ Server is reachable ($FAILURES/$TOTAL failures)"
          fi

      - name: Wait and recheck before rebooting
        if: steps.health.outputs.status == 'down'
        id: recheck
        run: |
          echo "All endpoints failed. Waiting 60s and rechecking..."
          sleep 60

          # Recheck with first two endpoints from config
          ENDPOINTS=$(grep '^\s*url:' endpoints.yml | sed 's/.*url:\s*//' | tr -d '"' | tr -d "'" | head -2)
          STILL_DOWN=true
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 30 "$url" 2>/dev/null || echo "000")
            echo "Recheck: $url → HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" != "000" ]; then
              STILL_DOWN=false
            fi
          done <<< "$ENDPOINTS"

          if [ "$STILL_DOWN" = "true" ]; then
            echo "still_down=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Still unreachable after 60s — will reboot"
          else
            echo "still_down=false" >> "$GITHUB_OUTPUT"
            echo "✅ Server recovered on recheck"
          fi

      - name: Reboot server via Hetzner API
        if: steps.health.outputs.status == 'down' && steps.recheck.outputs.still_down == 'true'
        run: |
          echo "🔄 Sending soft reboot request to Hetzner..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.hetzner.cloud/v1/servers/${{ secrets.HETZNER_SERVER_ID }}/actions/reboot" \
            -H "Authorization: Bearer ${{ secrets.HETZNER_API_TOKEN }}" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Hetzner API response: HTTP $HTTP_CODE"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Reboot initiated successfully"
          else
            echo "❌ Reboot request failed"
            exit 1
          fi

      - name: Wait for server to come back
        if: steps.health.outputs.status == 'down' && steps.recheck.outputs.still_down == 'true'
        run: |
          echo "Waiting 120s for server to boot..."
          sleep 120

          RECHECK_URL=$(grep '^\s*url:' endpoints.yml | sed 's/.*url:\s*//' | tr -d '"' | tr -d "'" | head -1)
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 30 "$RECHECK_URL" 2>/dev/null || echo "000")
            echo "Post-reboot check $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" != "000" ]; then
              echo "✅ Server is back online"
              exit 0
            fi
            sleep 30
          done

          echo "⚠️ Server did not come back after reboot — may need manual intervention"
          exit 1

      - name: Report to Ownersbox
        if: always()
        env:
          OBX_WEBHOOK_URL: ${{ secrets.OBX_WEBHOOK_URL }}
          OBX_TOKEN: ${{ secrets.OBX_TOKEN }}
        run: |
          # Push this run's outcome to the Ownersbox dashboard so JARVIS sees it
          # (the all-important "host was rebooted" event drives a post-mortem).
          # No-ops when the secrets aren't set — detection/reboot still ran.
          [ -z "${OBX_WEBHOOK_URL:-}" ] && { echo "No OBX_WEBHOOK_URL — skipping push"; exit 0; }
          [ -z "${OBX_TOKEN:-}" ] && { echo "No OBX_TOKEN — skipping push"; exit 0; }
          STATUS="${{ steps.health.outputs.status }}"
          STILL_DOWN="${{ steps.recheck.outputs.still_down }}"
          FAILURES="${{ steps.health.outputs.failures }}"
          TOTAL="${{ steps.health.outputs.total }}"
          if [ "$STATUS" = "down" ] && [ "$STILL_DOWN" = "true" ]; then
            LEVEL=critical; ACTION=reboot
          elif [ "$STATUS" = "down" ]; then
            LEVEL=warn; ACTION=observe
          else
            LEVEL=ok; ACTION=none
          fi
          NOW=$(date -u +%FT%TZ)
          curl -fsS -m 10 \
            -H "Authorization: Bearer ${OBX_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"layer\":\"health-check\",\"level\":\"${LEVEL}\",\"action\":\"${ACTION}\",\"target\":\"host\",\"reason\":\"endpoints ${FAILURES:-?}/${TOTAL:-?} unreachable\",\"reported_at\":\"${NOW}\"}" \
            "$OBX_WEBHOOK_URL" >/dev/null && echo "reported: $ACTION/$LEVEL" || echo "report POST failed"
