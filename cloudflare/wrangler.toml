name = "server-watchdog"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Every 2 minutes. Budget against the Workers FREE plan, which is a hard
# ceiling rather than a bill — exceeding a free limit fails the operation, it
# does not charge overage:
#
#   requests/day            720  of 100,000   (0.7%)
#   subrequests/invocation  ~14  of 50        (worst case: probe+recheck+
#                                              reboot+notify+verify)
#   cron triggers             1  of 5
#   CPU/invocation        comparisons only, of 10ms (awaiting fetch is not CPU)
#   KV / D1 / R2           none
#
# The 60s recheck happens INSIDE one invocation rather than across two, so this
# needs no KV for state. Cron invocations get 15 minutes of wall time and
# waiting does not consume CPU, so the whole down->recheck->reboot->verify
# sequence fits in a single scheduled run.
[triggers]
crons = ["*/2 * * * *"]

[vars]
# Deliberately NOT all 35 urls from endpoints.yml. They all resolve to the same
# host, so 35 proves nothing 6 do not, and 35 + a recheck would breach the
# 50-subrequest ceiling as the portfolio grows. These span different containers
# and both apex and rumio.world domains, so a single dead service cannot trip
# the switch on its own.
#
# Every entry must be a hostname the origin actually SERVES. The first deploy
# probed api.slotland.rumio.world — a pre-Reelmingo name with a stale DNS record
# and no Caddy site, where the origin closes the TLS handshake. That probe read
# as permanently down and could never contribute an "it is alive" signal.
PROBE_URLS = "https://ownersbox.rumio.world/api/health,https://api.rumio.world/health,https://axiss.support,https://etaxengine.com,https://app.reelmingo.com,https://whatarewemakingfordinner.com"

# Seconds to wait before the confirming recheck. Matches the GitHub workflow
# this replaces.
RECHECK_DELAY_SECONDS = "60"

# Endpoints that must ANSWER while the host is up: a 5xx or no answer, twice,
# is reported to Ownersbox as critical (never a reboot), again every 10 minutes
# while it lasts. Added after 2026-11-26, when api.rumio.world answered 502 for
# 38 minutes on a healthy box and nothing outside the box asked: the on-box
# check called a missing container healthy and the GitHub cron ran three times
# that day. The platform's health and the social-login relay, which every
# tenant's Google, Apple and Facebook sign-in goes through (it answers 400 to a
# request with no state, which is the route answering).
#
#   subrequests/invocation  +2, +2 on a recheck, +1 notify (still far under 50)
REQUIRED_URLS = "https://api.rumio.world/health,https://api.rumio.world/api/auth/relay/google"
REQUIRED_RECHECK_SECONDS = "30"
